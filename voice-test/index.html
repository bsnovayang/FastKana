<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>音檔檢查</title>
<style>
  :root { --bg:#F7F3EC; --card:#FFFDF9; --line:#E2DACD; --ink:#2D2A26; --ink2:#6B645A; --accent:#2F5D8A; --soft:#E3ECF5; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1B1A18; --card:#252320; --line:#3A3631; --ink:#ECE6DC; --ink2:#B3AB9E; --accent:#7FA9D6; --soft:#22303F; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { margin: 0 0 4px; font-size: 24px; }
  h2 { margin: 24px 0 8px; font-size: 16px; color: var(--ink2); }
  p { color: var(--ink2); margin: 0; }
  .grid { display: grid; grid-template-columns: repeat(var(--cols), 1fr); gap: 6px; }
  button { aspect-ratio: 1.1; border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--ink);
    display: flex; flex-direction: column; align-items: center; justify-content: center; font: inherit; cursor: pointer; padding: 0; }
  button b { font-size: 26px; font-weight: 500; line-height: 1.1; font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif; }
  button span { font-size: 12px; color: var(--ink2); }
  button.on { border-color: var(--accent); background: var(--soft); }
  .grid[style*="--cols:3"] button { aspect-ratio: 1.7; }
  .play-all { margin-top: 12px; padding: 10px 16px; border: 0; border-radius: 12px; background: var(--accent); color: #fff; font-weight: 800; aspect-ratio: auto; flex-direction: row; }
</style></head>
<body><main>
  <h1>音檔檢查</h1>
  <p>Google Gemini TTS（Kore）。點假名播放，聽到念錯或不清楚的請記下來。</p>
  <button class="play-all" id="all">▶ 依序全部播放</button>

"><b>よ</b><span>yo</span></button><button data-f="ra"><b>ら</b><span>ra</span></button><button data-f="ri"><b>り</b><span>ri</span></button><button data-f="ru"><b>る</b><span>ru</span></button><button data-f="re"><b>れ</b><span>re</span></button><button data-f="ro"><b>ろ</b><span>ro</span></button><button data-f="wa"><b>わ</b><span>wa</span></button><i></i><i></i><i></i><button data-f="wo"><b>を</b><span>wo</span></button><button data-f="n"><b>ん</b><span>n</span></button><i></i><i></i><i></i><i></i></div>
  <h2>濁音・半濁音</h2><div class="grid" style="--cols:5"><button data-f="ga"><b>が</b><span>ga</span></button><button data-f="gi"><b>ぎ</b><span>gi</span></button><button data-f="gu"><b>ぐ</b><span>gu</span></button><button data-f="ge"><b>げ</b><span>ge</span></button><button data-f="go"><b>ご</b><span>go</span></button><button data-f="za"><b>ざ</b><span>za</span></button><button data-f="ji"><b>じ</b><span>ji</span></button><button data-f="zu"><b>ず</b><span>zu</span></button><button data-f="ze"><b>ぜ</b><span>ze</span></button><button data-f="zo"><b>ぞ</b><span>zo</span></button><button data-f="da"><b>だ</b><span>da</span></button><button data-f="ji"><b>ぢ</b><span>ji</span></button><button data-f="zu"><b>づ</b><span>zu</span></button><button data-f="de"><b>で</b><span>de</span></button><button data-f="do"><b>ど</b><span>do</span></button><button data-f="ba"><b>ば</b><span>ba</span></button><button data-f="bi"><b>び</b><span>bi</span></button><button data-f="bu"><b>ぶ</b><span>bu</span></button><button data-f="be"><b>べ</b><span>be</span></button><button data-f="bo"><b>ぼ</b><span>bo</span></button><button data-f="pa"><b>ぱ</b><span>pa</span></button><button data-f="pi"><b>ぴ</b><span>pi</span></button><button data-f="pu"><b>ぷ</b><span>pu</span></button><button data-f="pe"><b>ぺ</b><span>pe</span></button><button data-f="po"><b>ぽ</b><span>po</span></button></div>
  <h2>拗音</h2><div class="grid" style="--cols:3"><button data-f="kya"><b>きゃ</b><span>kya</span></button><button data-f="kyu"><b>きゅ</b><span>kyu</span></button><button data-f="kyo"><b>きょ</b><span>kyo</span></button><button data-f="sha"><b>しゃ</b><span>sha</span></button><button data-f="shu"><b>しゅ</b><span>shu</span></button><button data-f="sho"><b>しょ</b><span>sho</span></button><button data-f="cha"><b>ちゃ</b><span>cha</span></button><button data-f="chu"><b>ちゅ</b><span>chu</span></button><button data-f="cho"><b>ちょ</b><span>cho</span></button><button data-f="nya"><b>にゃ</b><span>nya</span></button><button data-f="nyu"><b>にゅ</b><span>nyu</span></button><button data-f="nyo"><b>にょ</b><span>nyo</span></button><button data-f="hya"><b>ひゃ</b><span>hya</span></button><button data-f="hyu"><b>ひゅ</b><span>hyu</span></button><button data-f="hyo"><b>ひょ</b><span>hyo</span></button><button data-f="mya"><b>みゃ</b><span>mya</span></button><button data-f="myu"><b>みゅ</b><span>myu</span></button><button data-f="myo"><b>みょ</b><span>myo</span></button><button data-f="rya"><b>りゃ</b><span>rya</span></button><button data-f="ryu"><b>りゅ</b><span>ryu</span></button><button data-f="ryo"><b>りょ</b><span>ryo</span></button><button data-f="gya"><b>ぎゃ</b><span>gya</span></button><button data-f="gyu"><b>ぎゅ</b><span>gyu</span></button><button data-f="gyo"><b>ぎょ</b><span>gyo</span></button><button data-f="ja"><b>じゃ</b><span>ja</span></button><button data-f="ju"><b>じゅ</b><span>ju</span></button><button data-f="jo"><b>じょ</b><span>jo</span></button><button data-f="bya"><b>びゃ</b><span>bya</span></button><button data-f="byu"><b>びゅ</b><span>byu</span></button><button data-f="byo"><b>びょ</b><span>byo</span></button><button data-f="pya"><b>ぴゃ</b><span>pya</span></button><button data-f="pyu"><b>ぴゅ</b><span>pyu</span></button><button data-f="pyo"><b>ぴょ</b><span>pyo</span></button></div>
</main>
<script>
  const a = new Audio();
  let stop = false;
  const play = (b) => new Promise(res => {
    document.querySelectorAll('button.on').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    a.src = '../audio/' + b.dataset.f + '.mp3?r=1794290982393';
    a.onended = () => setTimeout(res, 350);
    a.onerror = res;
    a.play().catch(res);
  });
  document.addEventListener('click', async e => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.id === 'all') {
      stop = !stop ? false : true;
      for (const x of document.querySelectorAll('button[data-f]')) { if (stop) break; await play(x); }
      return;
    }
    stop = true;
    play(b);
  });
</script>
</body></html>
